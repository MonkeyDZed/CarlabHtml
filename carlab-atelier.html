<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>CARLAB – Atelier</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#16161a;--sf:#1f1f25;--sf2:#2a2a32;--ln:#383841;--tx:#ece9e6;--mu:#a0a0aa;--rd:#d92d2d;--ok:#4fbf8a;--wa:#e0a43a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Bahnschrift","Segoe UI",system-ui,sans-serif;display:flex;min-height:100vh}
nav{width:215px;background:var(--sf);border-right:1px solid var(--ln);padding:24px 14px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
.logo{font-size:28px;font-weight:700;margin:0 10px 26px;letter-spacing:.5px}
.logo b{color:var(--rd)}
nav button{background:none;border:0;color:var(--mu);text-align:left;padding:10px 12px;border-radius:6px;font:inherit;cursor:pointer;border-left:3px solid transparent}
nav button:hover{background:var(--sf2);color:var(--tx)}
nav button.on{color:var(--tx);border-left-color:var(--rd);background:var(--sf2)}
nav .sp{flex:1}
nav .sm{font-size:13px}
main{flex:1;padding:28px 34px;max-width:1180px}
h1{font-size:26px;margin:0 0 20px}
h2{font-size:17px;margin:0 0 14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:18px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.w2{grid-column:span 2}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mu)}
input,select{background:var(--bg);border:1px solid var(--ln);color:var(--tx);border-radius:6px;padding:9px 10px;font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--rd);outline-offset:1px}
button{font:inherit;background:var(--sf2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--mu)}
button.pri{background:var(--rd);border-color:var(--rd);color:#fff;font-weight:600}
button.pri:hover{filter:brightness(1.1)}
button.lnk{background:none;border:0;color:var(--mu);padding:4px 6px}
button.lnk:hover{color:var(--rd)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chips button.on{border-color:var(--rd);color:var(--rd)}
table{width:100%;border-collapse:collapse}
th{font-weight:600;color:var(--mu);font-size:13px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln)}
td{padding:10px;border-bottom:1px solid var(--ln);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td small{color:var(--mu);display:block}
td select{padding:5px 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:16px}
.kpi span{color:var(--mu);font-size:13px}
.kpi b{display:block;font-size:22px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.big{border-color:var(--rd)}
.ok{color:var(--ok)}.wa{color:var(--wa)}.mu{color:var(--mu)}
.empty{color:var(--mu);padding:18px 4px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:20px;width:100%;max-width:440px;color:var(--tx);box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.modal h3{margin:0 0 14px;font-size:18px}
.modal label{font-size:13px;color:var(--mu);margin-bottom:6px;display:block}
.modal input{width:100%;padding:8px;margin-bottom:10px;box-sizing:border-box}
.modal .row{margin-bottom:10px}
.modal .reste{font-size:15px;font-weight:700;margin-top:8px;display:block}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
@media (max-width:900px){body{flex-direction:column}nav{width:auto;flex-direction:row;flex-wrap:wrap;padding:12px}.logo{margin:0 14px 0 0}.grid,.kpis{grid-template-columns:repeat(2,1fr)}main{padding:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.backup-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:middle;border:1px solid #333}
.backup-dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.backup-dot.off{background:var(--rd);box-shadow:0 0 6px var(--rd)}
</style></head>
<body>
<nav>
 <div class="logo">CAR<b>LAB</b></div>
 <button data-tab="orders">Ordres de réparation</button>
 <button data-tab="historique">Historique</button>
 <button data-tab="mech">Équipe</button>
 <button data-tab="cash">Trésorerie</button>
 <div class="sp"></div>
 <button class="sm" data-act="export">Exporter les données</button>
 <button class="sm" data-act="backupConfig">Sauvegarde auto<span id="backup-indicator" class="backup-dot off" title="Sauvegarde auto inactive"></span></button>
 <button class="sm" data-act="import">Importer une sauvegarde</button>
 <button class="sm" data-act="clearDb" style="color:var(--rd)">Vider la BDD</button>
 <input id="imp" type="file" accept=".json" hidden>
</nav>
<main id="main"></main>

<div id="pm-overlay" class="modal-overlay">
 <div class="modal">
  <h3>Paiement / Prix de l'intervention</h3>
  <div class="row"><label>Véhicule : <span id="pm-vehicle"></span></label></div>
  <div class="row" id="pm-total-price-row" style="display:none"><label>Prix total de l'intervention (DA) <input id="pm-total-price" type="number" min="0" step="any"></label></div>
  <div class="row"><label>Prix total : <span id="pm-price"></span> DA</label></div>
  <div class="row"><label>Déjà payé : <span id="pm-already"></span> DA</label></div>
  <div class="row"><label>Montant à saisir (DA) <input id="pm-amount" type="number" min="0" step="any"></label></div>
  <div class="row"><label>Date <input id="pm-date" type="date"></label></div>
  <div class="row"><label>Note <input id="pm-note" type="text" placeholder="Acompte…"></label></div>
  <span id="pm-reste" class="reste"></span>
  <div class="actions">
   <button data-act="pm-cancel" class="lnk">Annuler</button>
   <button data-act="pm-confirm" class="pri">Confirmer</button>
  </div>
 </div>
</div>

function downloadBackup(data){
 const name=backupFileName();
 const b=new Blob([data],{type:'application/json'});
 const l=document.createElement('a');
 l.href=URL.createObjectURL(b);l.download=name;l.click();
}
async function runAutoBackup(){
 if(!autoBackup.enabled)return;
 if(!dataChanged())return;
 const data=JSON.stringify(S,null,1);
 let ok=false;
 if(autoBackup.folderHandle){ok=await writeBackupToFolder(data);}
 if(!ok){downloadBackup(data);}
}
function startAutoBackup(){
 if(autoBackup.timer)clearInterval(autoBackup.timer);
 window.removeEventListener('online',handleOnlineBackup);
 autoBackup.lastData=JSON.stringify(S);
 autoBackup.timer=setInterval(()=>{runAutoBackup();},autoBackup.intervalMs);
 window.addEventListener('online',handleOnlineBackup);
}
function handleOnlineBackup(){setTimeout(runAutoBackup,1000);}
function updateBackupIndicator(){
 const dot=$("#backup-indicator");
 if(!dot)return;
 if(autoBackup.enabled){
  dot.className="backup-dot on";
  dot.title=autoBackup.folderHandle?"Sauvegarde auto active (dossier configuré)":"Sauvegarde auto active (téléchargement)";

 }
 try{

  o.status=t.value;
  if(t.value==="Partiellement payé" || t.value==="Payé"){
   pendingPartialId=o.id;pendingPartialOld=oldStatus;
   openPartialModal(o);
  }
  save();render();
 }
 else if(t.dataset.appmech){appr(t.dataset.appmech).mechId=t.value;save();render()}
 else if(t.id==="period"||t.id==="dfCash"||t.id==="dtCash"){periodOr="all";render()}
 else if(t.id==="dfOr"){dateFromOr=t.value;periodOr="all";render()}
 else if(t.id==="dtOr"){dateToOr=t.value;periodOr="all";render()}
 else if(t.id==="f-or-vehicle"||t.id==="f-or-client"){render()}
 else if(t.id==="pm-amount"||t.id==="pm-total-price"){updateRestePreview();}
 else if(t.id==="imp"&&t.files[0]){
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
   if(!d.orders||!d.mechanics)throw 0;if(confirm("Remplacer les données actuelles par cette sauvegarde ?")){S=Object.assign({mechanics:[],orders:[],payouts:[],apprentices:[],days:[]},d);localStorage.setItem(KEY+"_ver",DATA_VERSION);save();render()}
  }catch(e){alert("Fichier de sauvegarde invalide.")}};r.readAsText(t.files[0]);t.value="";
  }
 });
/* ============ MODAL PAIEMENT ============ */
function openPartialModal(o){
 pendingPartialId=o.id;pendingPartialOld=o.status;
 const isNewPrice=(o.price||0)===0;
 document.getElementById("pm-total-price-row").style.display=isNewPrice?"block":"none";
 const remain=o.price-(o.amountPaid||0);
 $("#pm-vehicle").textContent=esc(o.vehicle)+" ("+esc(o.plate)+")";
 $("#pm-price").textContent=isNewPrice?"À définir":fmt(o.price);
 $("#pm-already").textContent=fmt(o.amountPaid||0);
 $("#pm-amount").value=remain>0?remain:0;
 $("#pm-total-price").value="";
 $("#pm-date").value=today();
 $("#pm-note").value="";
 document.getElementById("pm-reste").textContent="Reste après ce paiement : "+fmt(remain>0?remain:0)+" DA";
 document.getElementById("pm-overlay").classList.add("open");
}
function closePartialModal(){
 document.getElementById("pm-overlay").classList.remove("open");
 pendingPartialId=null;pendingPartialOld=null;
}
function updateRestePreview(){
 const amt=parseFloat($("#pm-amount").value)||0;
 const o=S.orders.find(x=>x.id===pendingPartialId);
 if(!o)return;
 const totalPrice=(o.price||0)===0?(parseFloat($("#pm-total-price").value)||0):(o.price||0);
 const already=(o.amountPaid||0);
 const remain=totalPrice-(already+amt);
 document.getElementById("pm-reste").textContent="Reste après ce paiement : "+fmt(remain>0?remain:0)+" DA";
}
function confirmPartial(){
 const amt=parseFloat($("#pm-amount").value)||0;
 const o=S.orders.find(x=>x.id===pendingPartialId);
 if(!o){closePartialModal();return;}
 if((o.price||0)===0){
  const totalPrice=parseFloat($("#pm-total-price").value)||0;
  o.price=totalPrice;
 }
 const newPaid=(o.amountPaid||0)+amt;
 o.amountPaid=newPaid;
 if(amt>0){
  o.paidDate=$("#pm-date").value||today();
  if(newPaid>=o.price){o.status="Payé"; o.amountPaid=o.price;}
  else{o.status="Partiellement payé";}
 }
 closePartialModal();save();render();
}
function cancelPartial(){
 const o=S.orders.find(x=>x.id===pendingPartialId);
 if(o&&pendingPartialOld)o.status=pendingPartialOld;
 closePartialModal();save();render();
}
document.getElementById("pm-overlay").addEventListener("click",e=>{
 if(e.target.id==="pm-overlay")cancelPartial();
});
/* ============ VUE HISTORIQUE ============ */
function vHistorique(){
 const fv=$("#f-or-vehicle")?$("#f-or-vehicle").value.toLowerCase():"";
 const fc=$("#f-or-client")?$("#f-or-client").value.toLowerCase():"";
 const list=S.orders.filter(o=>{
  if(fv&&!o.vehicle.toLowerCase().includes(fv))return false;
  if(fc&&!o.client.toLowerCase().includes(fc))return false;
  if(filterOr!=="Tous"&&o.status!==filterOr)return false;
  if(dateFromOr&&o.date<dateFromOr)return false;
  if(dateToOr&&o.date>dateToOr)return false;
  if(periodOr==="today")return o.date===today();
  if(periodOr==="yesterday"){const d=new Date();d.setDate(d.getDate()-1);return o.date===new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
  if(periodOr==="month")return o.date.startsWith(today().slice(0,7));
  return true;
 }).sort((a,b)=>b.date.localeCompare(a.date));
 const rows=list.map(o=>{
  const m=mech(o.mechId);
  const already=o.amountPaid||0;
  const remain=o.price-already;
  let payBadge="";
  if(o.status==="Partiellement payé")payBadge=`<small class="wa">Payé ${fmt(already)} / Reste ${fmt(remain)}</small>`;
  else if(o.status==="Payé")payBadge=`<small class="ok">Payé intégral</small>`;
  else if(remain>0)payBadge=`<small class="mu">Non payé</small>`;
  return `<tr>
   <td>${esc(o.date)}</td>
   <td>${esc(o.vehicle)}<small>${esc(o.plate)}</small></td>
   <td>${esc(o.client)}</td>
   <td>${esc(o.type)}</td>
   <td>${m?esc(m.name)+`<small>${o.rate} %</small>`:"<span class='mu'>–</span>"}</td>
   <td class="n">${fmt(o.price)}</td>
   <td class="n">${fmt(comm(o))}</td>
   <td><select data-status="${o.id}">${ST.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select>${payBadge}</td>
   <td class="n"><button class="lnk" data-act="edit" data-id="${o.id}">Modifier</button><button class="lnk" data-act="del" data-id="${o.id}">Supprimer</button>${o.status!=="Payé"?`<button class="lnk pri" data-act="payOrder" data-id="${o.id}" style="padding:2px 6px;font-size:12px">Payer</button>`:""}</td></tr>`}).join("");
 return `<h1>Historique des ordres de réparation</h1>
 <div class="card"><div class="row">
  <label>Véhicule<input id="f-or-vehicle" type="text" placeholder="Filtrer par véhicule…"></label>
  <label>Client<input id="f-or-client" type="text" placeholder="Filtrer par client…"></label>
 </div><div class="chips" style="margin-top:10px">
  ${["Tous",...ST].map(s=>`<button class="${filterOr===s?"on":""}" data-act="orfilt" data-v="${s}">${s}</button>`).join("")}
 </div><div class="chips" style="margin-top:10px">
  <button class="${periodOr==="today"?"on":""}" data-act="orf-today">Aujourd’hui</button>
  <button class="${periodOr==="yesterday"?"on":""}" data-act="orf-yesterday">Hier</button>
  <button class="${periodOr==="month"?"on":""}" data-act="orf-month">Mois courant</button>
  <button class="${periodOr==="all"?"on":""}" data-act="orf-all">Période totale</button>
 </div><div class="row" style="margin-top:10px;gap:10px;align-items:flex-end">
  <label>Du<input id="dfOr" type="date" value="${dateFromOr}"></label>
  <label>Au<input id="dtOr" type="date" value="${dateToOr}"></label>
  <button data-act="clearRangeOr" style="align-self:flex-end;padding:8px 14px">Effacer dates</button>
 </div></div>
 ${list.length?`<table><thead><tr><th>Date</th><th>Véhicule</th><th>Client</th><th>Intervention</th><th>Mécanicien</th><th class="n">Prix</th><th class="n">Commission</th><th>Statut</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty">Aucun ordre trouvé avec ces filtres.</div>`}`;
}
</script>
</body></html>
